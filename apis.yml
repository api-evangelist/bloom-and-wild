name: Bloom & Wild
description: 'Bloom & Wild is a UK-founded direct-to-consumer flower delivery and gifting company,
  known for pioneering letterbox flowers that fit through a standard mail slot. Founded in 2013 and
  headquartered in London, it operates across the UK and Europe under a family of brands including
  Bloom & Wild, Bloomon and Bergamotte, offering one-off bouquets, plants, gifts and flower
  subscriptions through its website and mobile apps. Backed by General Catalyst and Index Ventures,
  it is a consumer e-commerce business rather than a public API provider; this profile captures its
  public web, security and domain posture. It publishes a /.well-known/security.txt security contact
  but no public developer program, OpenAPI, or API documentation was found.'
